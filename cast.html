<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码答题 · 入口二维码</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .cast-qrs{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px;}
  .cast-qr-card{background:#fff;border-radius:16px;padding:18px 18px 14px;
    box-shadow:0 6px 22px rgba(15,23,42,.07);text-align:center;min-width:300px;}
  .cast-qr-role{display:inline-block;padding:5px 16px;border-radius:20px;font-size:15px;font-weight:700;}
  .cast-qr-role.role-staff{background:#dcfce7;color:#15803d;}
  .cast-qr-role.role-manager{background:#fef3c7;color:#b45309;}
  .cast-qr-name{font-size:17px;font-weight:700;margin:12px 0 4px;}
  .cast-qr-desc{font-size:12.5px;color:#64748b;margin-bottom:12px;line-height:1.6;}
  .cast-qr-url{font-size:12px;color:#94a3b8;word-break:break-all;margin-top:10px;line-height:1.5;}
</style>
</head>
<body>
<div class="cast-body">
  <div class="cast-title">📝 知识竞赛答题</div>
  <div class="cast-sub" id="cast-sub">微信扫一扫下方二维码，按身份进入对应答题</div>

  <div class="cast-qrs">
    <div class="cast-qr-card">
      <span class="cast-qr-role role-staff">店员</span>
      <div class="cast-qr-name">店员答题</div>
      <div class="cast-qr-desc">共 50 题 · 单选 20 / 多选 20 / 判断 10</div>
      <canvas id="qr-staff" width="300" height="300" style="width:300px;height:300px;display:block;margin:0 auto"></canvas>
      <div class="cast-qr-url" id="url-staff">正在获取地址…</div>
    </div>

    <div class="cast-qr-card">
      <span class="cast-qr-role role-manager">店长</span>
      <div class="cast-qr-name">店长答题</div>
      <div class="cast-qr-desc">共 50 题 · 单选 20 / 多选 20 / 判断 10</div>
      <canvas id="qr-manager" width="300" height="300" style="width:300px;height:300px;display:block;margin:0 auto"></canvas>
      <div class="cast-qr-url" id="url-manager">正在获取地址…</div>
    </div>
  </div>

  <div class="cast-stat">
    <div>店员答题<b id="st-count-staff">0</b></div>
    <div>店员平均分<b id="st-avg-staff">0</b></div>
    <div>店长答题<b id="st-count-manager">0</b></div>
    <div>店长平均分<b id="st-avg-manager">0</b></div>
  </div>

  <div class="cast-tip" id="cast-tip">手机需与本机连接同一个 WiFi</div>

  <!-- 无可用网卡 / 地址异常时的提示 -->
  <div class="cast-warn" id="cast-warn" style="display:none">
    <div class="cw-title">⚠️ 当前无法自动生成可用二维码</div>
    <div class="cw-list" id="cw-list"></div>
    <div class="cw-fix">解决方式：<b>把电脑连上 WiFi 或网线</b>后刷新本页；<br/>
      或启动服务时手动指定地址：<code>set QUIZ_URL=http://192.168.1.10:8080/</code></div>
  </div>

  <div class="cast-ifs" id="cast-ifs"></div>
</div>

<script src="assets/vendor/qrcode.js"></script>
<script src="assets/vendor/qrcode-render.js"></script>
<script>
(function(){
  var ROLES = [
    { key: 'staff',   label: '店员', canvasId: 'qr-staff',   urlId: 'url-staff' },
    { key: 'manager', label: '店长', canvasId: 'qr-manager', urlId: 'url-manager' }
  ];

  function draw(canvas, text){
    try{
      QRCodeRender.toCanvas(canvas, text, {
        width: 300, margin: 2, correctLevel: 'M',
        dark: '#0f172a', light: '#ffffff'
      });
    }catch(e){
      console.error('二维码生成失败', e);
      var ctx = canvas.getContext && canvas.getContext('2d');
      if(ctx){
        ctx.fillStyle='#ef4444';
        ctx.font='16px sans-serif';
        ctx.fillText('二维码生成失败: ' + e.message, 20, 150);
      }
    }
  }

  function showWarn(msg, list){
    document.getElementById('cast-warn').style.display = 'block';
    document.getElementById('cw-list').innerHTML = list || '';
    document.getElementById('cast-sub').textContent = msg || '请检查网络连接';
  }

  /** 当前站点基础目录（带尾斜杠），兼容子路径托管 */
  function baseDir(){
    var p = (location.pathname || '/');
    if(p.charAt(0) !== '/') p = '/' + p;
    var last = p.slice(p.lastIndexOf('/') + 1);
    if(last && last.indexOf('.') === -1) return p.replace(/[^/]*$/, '') + last + '/';
    return p.replace(/[^/]*$/, '');
  }

  /**
   * 解析最终要写入二维码的地址。
   * 优先级:
   *   1. 本地服务 /api/info 提供的局域网地址 (局域网模式)
   *   2. 当前站点基础目录 (GitHub Pages 等子路径托管模式)
   *      例: https://user.github.io/repo/cast.html -> https://user.github.io/repo/
   */
  function resolveUrl(){
    return fetch('/api/info?t=' + Date.now())
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status)); })
      .then(function(info){
        var ifs = document.getElementById('cast-ifs');
        if(info.all && info.all.length){
          var html = '<b>检测到的网卡：</b><br/>';
          info.all.forEach(function(c){
            html += (c.usable ? '🟢 ' : '⚪ ') + c.address + ' &nbsp; ' + c.name +
                    (c.gateway ? ' &nbsp;网关 ' + c.gateway : ' &nbsp;<i>无网关</i>') + '<br/>';
          });
          ifs.innerHTML = html;
        }

        if(info.fixed && info.url){
          document.getElementById('cast-tip').textContent = '地址已手动指定';
          return info.url;
        }
        if(info.url){
          document.getElementById('cast-tip').textContent =
            '手机需与本机连接同一个 WiFi · 来自网卡: ' + (info.iface||'');
          return info.url;
        }
        // 本地服务但没有可用网卡 -> 明确警告，并退回静态托管地址
        showWarn('未检测到手机可访问的局域网地址',
          '本地服务已启动，但没有找到手机能连上的真实网卡。<br/>' +
          '常见原因：电脑没连 WiFi/网线，或网卡地址属于代理/VPN 虚拟网卡。');
        var base = location.origin + baseDir();
        document.getElementById('cast-tip').textContent =
          '本地无可用网卡，当前显示的是静态托管地址（需手机能访问互联网）';
        return base;
      })
      .catch(function(err){
        // 没有 /api/info => 静态托管模式
        var base = location.origin + baseDir();
        document.getElementById('cast-tip').textContent =
          '静态托管模式（手机需能访问互联网）';
        return base;
      });
  }

  resolveUrl().then(function(base){
    ROLES.forEach(function(role){
      var url = base + '?role=' + role.key;
      document.getElementById(role.urlId).textContent = url;
      draw(document.getElementById(role.canvasId), url);
    });
  });

  function statsFor(role){
    try{
      var arr = JSON.parse(localStorage.getItem('quiz_stats_v1_' + role) || '[]');
      return arr;
    }catch(e){ return []; }
  }

  function stats(){
    ROLES.forEach(function(role){
      var arr = statsFor(role.key);
      var cnt = document.getElementById('st-count-' + role.key);
      var avg = document.getElementById('st-avg-' + role.key);
      if(!cnt || !avg) return;
      cnt.textContent = arr.length;
      if(arr.length){
        var sum = 0;
        arr.forEach(function(x){ sum += x.score; });
        avg.textContent = Math.round(sum / arr.length);
      } else {
        avg.textContent = '0';
      }
    });
  }
  stats();
  setInterval(stats, 2000);
})();
</script>
</body>
</html>
