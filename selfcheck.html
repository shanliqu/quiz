<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码答题 · 自检</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body{background:#f1f5f9;padding:20px;}
  .wrap{max-width:680px;margin:0 auto;}
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;}
  .card h2{margin:0 0 12px;font-size:16px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid #e2e8f0;font-size:14px;gap:12px;}
  .row:last-child{border-bottom:none;}
  .row b{font-weight:600;}
  .pass{color:#15803d;background:#dcfce7;padding:2px 9px;border-radius:10px;font-size:12.5px;}
  .fail{color:#b91c1c;background:#fee2e2;padding:2px 9px;border-radius:10px;font-size:12.5px;}
  .btn{display:block;width:100%;padding:13px;margin-top:10px;border:none;border-radius:10px;
    background:#1e88e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .hint{font-size:13px;color:#64748b;line-height:1.8;}
  code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:12.5px;}
  .role-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-right:8px;}
  .role-staff{background:#dcfce7;color:#15803d;}
  .role-manager{background:#fef3c7;color:#b45309;}
  .qr-pair{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .qr-box{text-align:center;}
  .qr-box .hint{margin-top:8px;word-break:break-all;font-size:11.5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>服务自检</h2>

    <div style="margin-bottom:14px;">
      <span class="role-tag role-staff">店员</span>
      <span class="role-tag role-manager">店长</span>
    </div>

    <div class="row"><span>店员题库</span><b id="c-staff">检查中…</b></div>
    <div class="row"><span>店员题量</span><b id="c-staff-quota">检查中…</b></div>
    <div class="row"><span>店员答案越界</span><b id="c-staff-range">检查中…</b></div>
    <div class="row"><span>店长题库</span><b id="c-manager">检查中…</b></div>
    <div class="row"><span>店长题量</span><b id="c-manager-quota">检查中…</b></div>
    <div class="row"><span>店长答案越界</span><b id="c-manager-range">检查中…</b></div>
    <div class="row"><span>局域网地址</span><b id="c-ip">检查中…</b></div>
  </div>

  <div class="card">
    <h2>手机访问测试</h2>
    <p class="hint">用手机微信「扫一扫」扫下面对应身份的二维码，能打开答题首页说明链路完全打通。</p>
    <div class="qr-pair">
      <div class="qr-box">
        <span class="role-tag role-staff">店员</span>
        <canvas id="qr-staff" width="260" height="260" style="width:260px;height:260px;"></canvas>
        <div class="hint" id="qurl-staff"></div>
      </div>
      <div class="qr-box">
        <span class="role-tag role-manager">店长</span>
        <canvas id="qr-manager" width="260" height="260" style="width:260px;height:260px;"></canvas>
        <div class="hint" id="qurl-manager"></div>
      </div>
    </div>
    <a class="btn" id="openbtn-staff" href="index.html?role=staff">打开店员答题首页</a>
    <a class="btn" id="openbtn-manager" href="index.html?role=manager">打开店长答题首页</a>
  </div>
</div>

<script src="assets/core.js"></script>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/vendor/qrcode-render.js"></script>
<script>
(function(){
  var C = window.QuizCore;
  var QUOTA = { single: 20, multi: 20, judge: 10 };

  function badge(el, ok, text){
    if(!el) return;
    el.className = ok ? 'pass' : 'fail';
    el.textContent = text;
  }

  /** 检查一套题库并渲染对应二维码 */
  function checkRole(role, prefix){
    return fetch(C.assetUrl(role.bankUrl) + '?t=' + Date.now())
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(bank){
        badge(document.getElementById('c-' + prefix),
              Array.isArray(bank) && bank.length > 0,
              (bank.length || 0) + ' 道题');
        var chk = C.checkBank(bank, QUOTA);
        badge(document.getElementById('c-' + prefix + '-quota'), chk.ok,
              chk.ok ? '充足 (20/20/10)' : chk.problems[0]);
        var bad = C.checkAnswersInRange(bank);
        badge(document.getElementById('c-' + prefix + '-range'), bad.length === 0,
              bad.length === 0 ? '全部正常' : bad.length + ' 处越界');
      })
      .catch(function(e){
        badge(document.getElementById('c-' + prefix), false, '加载失败: ' + e.message);
        badge(document.getElementById('c-' + prefix + '-quota'), false, '未知');
        badge(document.getElementById('c-' + prefix + '-range'), false, '未知');
      });
  }

  // 地址检查：优先本地服务，其次静态托管（GitHub Pages 等）
  function baseDir(){
    var p = (location.pathname || '/');
    if(p.charAt(0) !== '/') p = '/' + p;
    var last = p.slice(p.lastIndexOf('/') + 1);
    if(last && last.indexOf('.') === -1) return p.replace(/[^/]*$/, '') + last + '/';
    return p.replace(/[^/]*$/, '');
  }

  function showUrl(url, ipText, ipOk){
    badge(document.getElementById('c-ip'), ipOk, ipText);
    [['staff', C.ROLES.staff], ['manager', C.ROLES.manager]].forEach(function(pair){
      var key = pair[0], role = pair[1];
      var full = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'role=' + key;
      document.getElementById('qurl-' + key).textContent = full;
      document.getElementById('openbtn-' + key).href = full;
      QRCodeRender.toCanvas(document.getElementById('qr-' + key), full, {
        width: 260, margin: 2, correctLevel: 'M',
        dark: '#0f172a', light: '#ffffff'
      });
    });
  }

  fetch('/api/info?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(info){
      if(info.url){
        showUrl(info.url,
          (info.ip || '已指定') + (info.iface ? ' (' + info.iface + ')' : ''), true);
      } else {
        showUrl(location.origin + baseDir(), '静态托管模式（本地无可用网卡）', false);
      }
    })
    .catch(function(){
      showUrl(location.origin + baseDir(), '静态托管模式', false);
    });

  checkRole(C.ROLES.staff, 'staff');
  checkRole(C.ROLES.manager, 'manager');
})();
</script>
</body>
</html>
